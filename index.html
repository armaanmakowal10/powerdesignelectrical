<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page <title>, description, canonical, Open Graph and JSON-LD are
         injected at build time by the <Seo> component (vite-react-ssg / Head).
         No static <title> here on purpose — it would duplicate the per-page one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the fonts the production theme actually uses (Fraunces / Outfit /
         JetBrains Mono / Montserrat). Alternate-theme fonts were dropped to cut
         render-blocking font weight on mobile. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Leaflet (only used on /locations). Deferred so it never blocks render
         on any page; it still executes before the app module mounts. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
